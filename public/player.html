<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مشغل الفيديو — TelegramFlix</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0b0b0f;
      color: #f5f5f7;
      font-family: "Cairo", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      overflow: hidden;
    }
    .wrap { display: flex; flex-direction: column; height: 100vh; }
    .topbar {
      padding: 0.7rem 1.2rem;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
    }
    .logo { font-weight: 800; color: #e50914; font-size: 1.1rem; }
    .status { font-size: 0.8rem; color: #9a9aa5; }
    .status.on { color: #34c759; }
    .status.err { color: #ff383c; }
    .status.load { color: #ffcc00; }

    .stage {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    .stage video {
      width: 100%;
      height: 100%;
      background: #000;
      display: block;
      outline: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1a1a20 0%, #0b0b0f 100%);
      text-align: center;
      padding: 2rem;
      gap: 1.2rem;
      z-index: 10;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid rgba(229,9,20,0.18);
      border-top-color: #e50914;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .overlay h2 { font-size: 1.2rem; font-weight: 700; }
    .overlay p { color: #9a9aa5; font-size: 0.9rem; max-width: 480px; line-height: 1.7; }

    .progress {
      width: 280px;
      max-width: 80vw;
      height: 6px;
      background: #1a1a20;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress > div {
      height: 100%;
      background: #e50914;
      width: 0%;
      transition: width 0.25s ease;
    }

    .error {
      background: rgba(229,9,20,0.08);
      border: 1px solid #e50914;
      border-radius: 12px;
      padding: 1.5rem 1.8rem;
      max-width: 520px;
      text-align: center;
    }
    .error h3 { color: #ff383c; margin-bottom: 0.8rem; font-size: 1.05rem; }
    .error p { color: #9a9aa5; line-height: 1.7; font-size: 0.9rem; }
    .error .actions {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 1.2rem;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: 0.55rem 1.1rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn.primary { background: #e50914; color: #fff; }
    .btn.primary:hover { background: #ff2b36; }
    .btn.ghost {
      background: transparent;
      color: #f5f5f7;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn.ghost:hover { background: rgba(255,255,255,0.06); }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="logo">TelegramFlix</div>
      <div class="status load" id="status">⏳ جاري التحضير...</div>
    </header>

    <div class="stage" id="stage">
      <div class="overlay" id="loading">
        <div class="spinner"></div>
        <h2 id="loadingTitle">جاري تحميل الحلقة</h2>
        <p id="loadingText">
          يرجى الانتظار بينما نجلب الفيديو من Telegram...
        </p>
        <div class="progress"><div id="progressBar"></div></div>
      </div>

      <div class="overlay hidden" id="errorBox">
        <div class="error">
          <h3 id="errorTitle">حدث خطأ</h3>
          <p id="errorMsg"></p>
          <div class="actions">
            <a class="btn primary" id="errorTgBtn" target="_blank" rel="noopener">
              📱 فتح في تليجرام
            </a>
            <button class="btn ghost" onclick="location.reload()">
              🔄 إعادة المحاولة
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
  (function () {
    'use strict';

    var $ = function (id) { return document.getElementById(id); };
    var statusEl    = $('status');
    var loadingEl   = $('loading');
    var loadingTxt  = $('loadingText');
    var loadingTtl  = $('loadingTitle');
    var progressBar = $('progressBar');
    var errorBox    = $('errorBox');
    var errorTtl    = $('errorTitle');
    var errorMsg    = $('errorMsg');
    var errorTgBtn  = $('errorTgBtn');
    var stage       = $('stage');

    var params = new URLSearchParams(location.search);
    var tgUrl  = params.get('url');

    function setStatus(cls, text) {
      statusEl.className = 'status ' + cls;
      statusEl.textContent = text;
    }

    function showError(title, msg, fallbackUrl) {
      loadingEl.classList.add('hidden');
      errorBox.classList.remove('hidden');
      errorTtl.textContent = title;
      errorMsg.textContent = msg;
      if (fallbackUrl) errorTgBtn.href = fallbackUrl;
      setStatus('err', '❌ خطأ');
    }

    function showVideo(blobUrl) {
      loadingEl.classList.add('hidden');
      errorBox.classList.add('hidden');

      var video = document.createElement('video');
      video.src = blobUrl;
      video.controls = true;
      video.autoplay = true;
      video.playsInline = true;
      video.preload = 'auto';
      video.style.width = '100%';
      video.style.height = '100%';

      stage.innerHTML = '';
      stage.appendChild(video);

      video.addEventListener('play', function () {
        setStatus('on', '▶ قيد التشغيل');
      });
      video.addEventListener('pause', function () {
        setStatus('on', '⏸ متوقف مؤقتاً');
      });
      video.addEventListener('ended', function () {
        setStatus('on', '✅ انتهت الحلقة');
      });
      video.addEventListener('error', function () {
        showError('خطأ في تشغيل الفيديو', 'المتصفح رفض تشغيل الفيديو', tgUrl);
      });

      var p = video.play();
      if (p && p.catch) {
        p.catch(function () {
          setStatus('on', '▶ اضغط للتشغيل');
        });
      }
    }

    function parseTelegramUrl(url) {
      if (!url) return null;
      var m = url.match(/t\.me\/c\/(\d+)\/(\d+)/);
      if (m) return { channel: '-100' + m[1], messageId: parseInt(m[2], 10) };
      m = url.match(/t\.me\/([A-Za-z0-9_]{4,})\/(\d+)/);
      if (m) return { channel: m[1], messageId: parseInt(m[2], 10) };
      return null;
    }

    function waitForPlayerAPI(timeoutMs) {
      return new Promise(function (resolve) {
        var started = Date.now();
        var tick = function () {
          var api = window.__tg_player_api__;
          if (api && api.isReady && typeof api.loadVideo === 'function') {
            return resolve(api);
          }
          if (Date.now() - started > timeoutMs) return resolve(null);
          setTimeout(tick, 150);
        };
        tick();
      });
    }

    if (!tgUrl) {
      showError('لم يتم تحديد الحلقة', 'أضف ?url=https://t.me/... إلى رابط الصفحة.', 'https://t.me');
      return;
    }

    var parsed = parseTelegramUrl(tgUrl);
    if (!parsed) {
      showError('رابط غير صالح', 'تأكد أن الرابط بصيغة t.me/channel/123 أو t.me/c/123/456.', tgUrl);
      return;
    }

    errorTgBtn.href = tgUrl;

    (async function boot() {
      try {
        setStatus('load', '🔍 جاري البحث عن الجلسة...');

        var api = await waitForPlayerAPI(8000);

        if (!api) {
          showError(
            'لم يتم العثور على عميل تليجرام',
            'افتح الصفحة الرئيسية أولاً لتسجيل الدخول، ثم أعد تحميل هذه الصفحة.',
            tgUrl
          );
          return;
        }

        var session = api.getSession ? api.getSession() : null;
        if (!session) {
          showError(
            'لا توجد جلسة مسجّلة',
            'افتح الصفحة الرئيسية وسجّل الدخول بحسابك، ثم أعد المحاولة.',
            tgUrl
          );
          return;
        }

        setStatus('load', '📥 جاري تحميل الفيديو...');
        loadingTtl.textContent = 'جاري تحميل الفيديو من Telegram';
        loadingTxt.textContent = 'قد يستغرق هذا بضع دقائق حسب حجم الحلقة...';

        api.loadVideo(parsed.channel, parsed.messageId, {
          onProgress: function (percent) {
            var p = Math.max(0, Math.min(100, Number(percent) || 0));
            progressBar.style.width = p + '%';
            loadingTxt.textContent = 'جاري التحميل... ' + Math.round(p) + '%';
          },
          onComplete: function (blobUrl) {
            showVideo(blobUrl);
          },
          onError: function (errMsg) {
            showError('فشل تحميل الفيديو', errMsg, tgUrl);
          }
        });
      } catch (e) {
        showError('خطأ غير متوقع', e.message || String(e), tgUrl);
      }
    })();
  })();
  </script>
</body>
</html>
